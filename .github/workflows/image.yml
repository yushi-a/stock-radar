name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # PR ではビルドだけして push しない。壊れた Dockerfile を main に入れないための関門で、
      # fork からの PR には packages:write が付かないので login も PR では行わない。
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Helmfile から参照するのは sha- タグ。どのコミットが動いているかを
          # イメージ名だけで特定できるようにする。latest は人が試すとき用。
          # semver は既定で先頭の v を外すが、Git タグ（v0.1.0）と同じ文字列で
          # 引けるよう v を付け直す。
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # push しない PR では手元の docker に取り出す。次の起動確認に使う。
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ビルドが通るだけでは実行層の壊れ（起動しない、curl が無い）を拾えない。
      # PR では load したイメージ、main では push したイメージを叩く。
      - run: |
          docker run --rm "${IMAGE}:${TAG}" --help > /dev/null
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -c 'id -u | grep -qv "^0$" && command -v curl'
        env:
          TAG: ${{ steps.meta.outputs.version }}

name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # PR ではビルドだけして push しない。壊れた Dockerfile を main に入れないための関門で、
      # fork からの PR には packages:write が付かないので login も PR では行わない。
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Helmfile から参照するのは sha- タグ。どのコミットが動いているかを
          # イメージ名だけで特定できるようにする。latest は人が試すとき用。
          # semver は既定で先頭の v を外すが、Git タグ（v0.1.0）と同じ文字列で
          # 引けるよう v を付け直す。
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # push しない PR では手元の docker に取り出す。次の起動確認に使う。
          load: ${{ github.event_name == 'pull_request' }}
          # setup-buildx（docker-container ドライバ）では provenance の attestation が既定で付き、
          # push するイメージが OCI image index になる。単一マニフェストにして、
          # web-front・notificator・stock-notificator と揃える。
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ビルドが通るだけでは実行層の壊れ（起動しない、curl が無い）を拾えない。
      # PR では load したイメージ、main では push したイメージを叩く。
      - run: |
          docker run --rm "${IMAGE}:${TAG}" --help > /dev/null
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -c 'id -u | grep -qv "^0$" && command -v curl'
        env:
          TAG: ${{ steps.meta.outputs.version }}

      # PR では load したイメージ、main・タグでは push したイメージ（digest で指す）を調べる。
      - id: scan-ref
        run: |
          if [ "${PUSHED}" = "true" ]; then
            echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          fi
        env:
          PUSHED: ${{ github.event_name != 'pull_request' }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.version }}

      # Trivy の Action はタグを付け替えられた前例があるため、他と違ってコミット SHA で固定する。
      # HIGH は表に出すだけで落とさない。先に回して、CRITICAL で落ちても一覧が残るようにする。
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.scan-ref.outputs.image }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      # 修正版のある CRITICAL が残っていれば落とす。
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.scan-ref.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

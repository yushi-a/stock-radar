version: 2
updates:
  # Actions のバージョン追従。Python の依存は uv.lock で固定しており、ここでは扱わない。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"

# 運用パラメータ。判定条件ではないので criteria.yaml とは分けてある。
# 混ぜると「閾値を変えていないのに screen_runs.criteria_snapshot が変わる」状態になる。
#
# 初期値は保守的（間隔・予算ともに長め）に置いてある。429 の発生状況を Phase 3 で
# 実測してから詰める。設計の根拠は docs/architecture.md の「株価取得の設計」。

sec:
  # SEC は User-Agent に連絡先を含めることを求めている（SEC Developer FAQ）。
  # 実際の値は環境変数 SEC_USER_AGENT で渡す。ここには置かない。
  user_agent_env: SEC_USER_AGENT
  # companyfacts.zip は毎晩 ET 3:00 頃に再生成される。1ファイル1GB超あるため、
  # 取得・パース後に古い世代を削除して最新1世代のみ保持する。
  raw_dir: data/raw/sec
  keep_generations: 1
  # SEC の fair access は 10 リクエスト/秒。0.15秒間隔で約6.7 req/秒。
  min_request_interval_sec: 0.15
  max_attempts: 3
  # 指数バックオフの初項。Retry-After があればそちらを優先する。
  retry_backoff_sec: 2.0
  # submissions.zip は 1.5GB。ユニバース（上場・SIC・提出フォーム）は週次では
  # ほとんど動かないので、毎回落とさない。
  submissions_max_age_days: 7
  # companyfacts.zip は 1.4GB。SEC は毎晩 ET 3:00 頃に再生成するが、
  # 週次バッチなので毎回落とす必要はない。
  companyfacts_max_age_days: 6

prices:
  # 取得ウィンドウ。**営業日**で指定する（暦日ではない）。
  # 52週高安には約252営業日が要る。315営業日 ≒ 1年3ヶ月で余裕を持たせてある。
  window_days: 315
  overlap_days: 5             # 遡及調整（株式分割）の検知に使う重複日数
  # これより新しい株価が手元にあれば取得し直さない。週末・祝日をまたぐ余裕。
  up_to_date_within_days: 5

  # 適応型スロットリング。429 から回復するのではなく、そもそも 429 を踏まない速度で回す。
  # 2,000銘柄に24時間を割り当てれば1件あたり43秒まで許容できる。
  throttle:
    base_interval_sec: 3.0
    jitter_sec: 2.0
    min_interval_sec: 3.0
    max_interval_sec: 120.0
    # 429 を受けたら、そのリクエストだけリトライするのではなく全体の間隔を倍にする。
    # Yahoo のレート制限は IP 単位で粘着的なため、1件だけ待って再開するとすぐまた踏む。
    backoff_multiplier: 2.0
    recovery_after_successes: 200
    recovery_factor: 0.9

  # 適応制御でも収まらない場合の段階的退避。IP 単位のペナルティは数時間で解ける
  # 性質のものなので、短いリトライを繰り返すより長く待つ方が有効。
  circuit_breaker:
    consecutive_429_threshold: 5
    pause_sec: [1800, 7200, 21600, 43200]   # 30分 → 2h → 6h → 12h

  # 壁時計の予算。超過したら取得を打ち切り、その時点のデータで以降の工程を走らせる。
  # 差分更新なので取れなかった分は次回の run に持ち越される。
  budget:
    max_wall_clock_sec: 72000        # 20時間。目安であり調整前提
    on_exceeded: continue_next_run

  retry:
    max_attempts_per_run: 3
    # 恒久的失敗（シンボル不正＝上場廃止・ティッカー変更の疑い）と判定するまでの連続回数。
    permanent_error_threshold: 3

  # 株価取得の成功率がこれを下回ったら通知に警告を出す。これが無いと
  # 「今週は候補が5件しか出なかった」のが相場のせいなのか取得失敗のせいなのか判別できない。
  coverage_warn_threshold: 0.90

output:
  csv_dir: output

notify:
  # 宛先は環境変数 NOTIFICATOR_ADDRESS で渡す。
  address_env: NOTIFICATOR_ADDRESS
  # Connect プロトコルの unary + JSON。grpcio も proto のコード生成も不要。
  path: /yuxsr.notification.v1.NotificatorService/Notify
  timeout_sec: 10
  # バックエンドが LINE Bot の push message（5,000文字上限）のため、実用上は数百文字に
  # 収める。CSV は添付できないので Drive に上げて URL を載せる（drive）。
  max_message_chars: 900
  # 通知に載せる候補の上限。**あふれた分は「ほかN件は省略」と書いてから落とす。**
  # 黙って切ると、届いた一覧が候補の全部だと読めてしまう。
  # 20件は実測の候補数（21件前後）とほぼ同じで、社名込みでも900文字に収まる件数。
  max_listed: 20

drive:
  # CSV を Google Drive の非公開フォルダに上げ、通知に URL を載せる（#48）。
  # 評価スキルは claude.ai / クラウドで動かすので、PVC に置くだけでは届かない。
  # 個人アカウントではサービスアカウントが使えない（保存容量が無い）ため、
  # 本人の OAuth リフレッシュトークンで書く。取得は `stock-radar drive-auth`。
  # スコープは drive.file（このアプリが作ったファイルにしか触れない）。
  # 失敗しても run は落とさず、通知に失敗を書く（CSV は PVC に残る）。
  client_id_env: GOOGLE_OAUTH_CLIENT_ID
  client_secret_env: GOOGLE_OAUTH_CLIENT_SECRET
  refresh_token_env: GOOGLE_OAUTH_REFRESH_TOKEN
  # 上げ先のフォルダ。ID が環境変数に入っているときだけ ID で特定する（#60）。
  # 名前を変えても移動しても追える。特定できなければ失敗にし、名前で探すほうへは戻らない。
  # drive.file では手で作ったフォルダは見えないので、入れるのはアプリが作ったフォルダの ID。
  folder_id_env: GOOGLE_DRIVE_FOLDER_ID
  # ID が無いときは、この名前で探して無ければ作る。
  folder_name: stock-radar
  timeout_sec: 30

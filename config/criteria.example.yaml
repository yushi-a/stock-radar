# スクリーニング条件のたたき台。根拠は docs/screening-criteria.md を参照。
# 閾値は未確定。確定後に criteria.yaml としてコピーして使う。
#
# このファイルは「判定条件」だけを持つ。実行時に screen_runs.criteria_snapshot へ
# そのまま記録されるため、スロットリングや時間予算などの運用パラメータは混ぜない。
# それらは config/runtime.yaml に置く（docs/architecture.md 参照）。

common:
  us:
    market_cap_usd: { min: 300_000_000, max: 8_000_000_000 }  # 下限: Yartseva 中央値 $348M / 上限: 既存フレーム
    avg_daily_value_usd: { min: 5_000_000 }                   # 見解
  jp:
    market_cap_jpy: { min: 5_000_000_000, max: 100_000_000_000 }  # 岡三は 50億〜500億円。上限は見解
    avg_daily_value_jpy: { min: 50_000_000 }                      # 見解
  equity_positive: true
  exclude_sectors: [banks, insurance, securities, other_financials, reit]  # 米国は SIC 6000番台で判定
  revenue_positive: true      # 臨床段階バイオ・SPAC を除外（売上基準の指標が計算不能になるため）
  us_exclude_adr: true        # 10-K 提出企業のみ。20-F/6-K は開示頻度・会計基準・XBRL の揃い方が異なる

track_a:  # 黒字・割安型（Yartseva 準拠）
  revenue_cagr_3y: { min: 0.10 }
  op_margin:
    us: { min: 0.0, exclusive: true }
    jp: { min: 0.05 }   # 岡三条件
  fcf_yield: { min: 0.04 }
  pbr: { max: 2.5 }     # B/M >= 0.4
  profitability_any:
    roa: { min: 0.05 }
    roe: { min: 0.10 }
  # 米国第一弾は EBITDA ではなく EBIT（営業利益）で代用する。
  # 減価償却費は XBRL のタグ揺れが激しく実装コストが跳ね上がるため。
  # 趣旨（資産を膨らませているのに収益が伴わない企業を外す）は EBIT でも保てる。
  asset_growth_minus_ebit_growth: { max: 0.0 }

track_b:  # 高成長型（赤字許容、見解ベース）
  revenue_growth_yoy: { min: 0.25 }
  # 米国には会社予想が無い（10-K/10-Q にガイダンスは含まれない）ため、
  # 直近四半期の前年同期比で代替する。日本版では会社予想（FSales）を使う。
  revenue_growth_latest_quarter_yoy: { min: 0.20 }
  op_margin: { min: -0.20 }   # 評価スキルの PSR 切替境界
  gross_margin: { min: 0.40 }
  psr: { max: 8.0 }
  financial_buffer_any:
    equity_ratio: { min: 0.50 }
    current_ratio: { min: 1.5 }

timing_bonus:  # 並べ替え用。ハードフィルタにしない
  drawdown_from_52w_high: { min: -0.50, max: -0.20 }
  range_position_52w: { max: 0.50 }
  jp_years_since_listing: { max: 10 }
  jp_owner_in_top3_holders: true

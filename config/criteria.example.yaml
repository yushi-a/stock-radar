# スクリーニング条件のたたき台。根拠は docs/screening-criteria.md を参照。
# 閾値は未確定。確定後に criteria.yaml としてコピーして使う。

common:
  us:
    market_cap_usd: { min: 300_000_000, max: 8_000_000_000 }  # 下限: Yartseva 中央値 $348M / 上限: 既存フレーム
    avg_daily_value_usd: { min: 5_000_000 }                   # 見解
  jp:
    market_cap_jpy: { min: 5_000_000_000, max: 100_000_000_000 }  # 岡三は 50億〜500億円。上限は見解
    avg_daily_value_jpy: { min: 50_000_000 }                      # 見解
  equity_positive: true
  exclude_sectors: [banks, insurance, securities, other_financials, reit]

track_a:  # 黒字・割安型（Yartseva 準拠）
  revenue_cagr_3y: { min: 0.10 }
  op_margin:
    us: { min: 0.0, exclusive: true }
    jp: { min: 0.05 }   # 岡三条件
  fcf_yield: { min: 0.04 }
  pbr: { max: 2.5 }     # B/M >= 0.4
  profitability_any:
    roa: { min: 0.05 }
    roe: { min: 0.10 }
  asset_growth_minus_ebitda_growth: { max: 0.0 }

track_b:  # 高成長型（赤字許容、見解ベース）
  revenue_growth_yoy: { min: 0.25 }
  revenue_growth_forecast: { min: 0.20 }
  op_margin: { min: -0.20 }   # 評価スキルの PSR 切替境界
  gross_margin: { min: 0.40 }
  psr: { max: 8.0 }
  financial_buffer_any:
    equity_ratio: { min: 0.50 }
    current_ratio: { min: 1.5 }

timing_bonus:  # 並べ替え用。ハードフィルタにしない
  drawdown_from_52w_high: { min: -0.50, max: -0.20 }
  range_position_52w: { max: 0.50 }
  jp_years_since_listing: { max: 10 }
  jp_owner_in_top3_holders: true
